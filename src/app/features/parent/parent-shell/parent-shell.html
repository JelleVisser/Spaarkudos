<main class="parent-page">
  <header class="page-header">
    <a class="brand" routerLink="/dashboard">Spaarkudos</a>
    <div class="header-actions">
      <a routerLink="/dashboard/shop">Shop beheren</a>
      <button type="button" (click)="signOut()">Uitloggen</button>
    </div>
  </header>

  <section class="welcome-card" aria-labelledby="welcome-title">
    <p class="eyebrow">Ouderomgeving</p>
    <h1 id="welcome-title">Welkom, {{ parentName() }}</h1>

    @if (isCreatingInitialGroup()) {
      <p aria-live="polite">Je familiegroep wordt voorbereid...</p>
    } @else {
      <p>Beheer hier jullie familiegroep en kinderen.</p>
    }

    @if (errorMessage(); as error) {
      <p class="error-message" role="alert">{{ error }}</p>
    }
  </section>

  @if (!isCreatingInitialGroup()) {
    <app-child-management />
  }
</main>
